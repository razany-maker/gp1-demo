name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # FIXED: Explicitly install pytest and bandit here to ensure they exist,
      # regardless of whether they are in requirements.txt
      - name: Install test dependencies
        run: |
          pip install flask pytest pytest-flask bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        # using -v (verbose) helps you see WHICH test failed in the logs
        run: pytest -v

      - name: Security Scan
        # Added -ll (level: low) to ensure we see all issues, but you can change logic
        # If you want the build to PASS even if bandit finds issues, add " || true" at the end.
        run: bandit -r .

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gp1-demo:latest